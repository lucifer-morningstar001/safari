<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="shortcut icon" href="favicon2.png" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
        }

        .video-box {
            width: 30%;
            max-width: 700px;
            margin: 0 auto;
        }

        .video-box video {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .video-box {
                width: 75%;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            .video-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="video-box">

        <video autoplay muted loop playsinline>
            <!-- 1. Safari / iOS ke liye (H.265 MP4) -->
            <source src="safari-video-1.mp4" type='video/mp4; codecs="hvc1"'>
            
            <!-- 2. Chrome / Android / Windows ke liye (VP9 WEBM) -->
       
        </video>
<video autoplay muted loop playsinline>
            <!-- 1. Safari / iOS ke liye (H.265 MP4) -->
            <source src="safari-video-2.mp4" type='video/mp4; codecs="hvc1"'>
            
            <!-- 2. Chrome / Android / Windows ke liye (VP9 WEBM) -->
       
        </video>
        <video autoplay muted loop playsinline>
            <!-- 1. Safari / iOS ke liye (H.265 MP4) -->
            <source src="safari-video-3.mp4" type='video/mp4; codecs="hvc1"'>
            
            <!-- 2. Chrome / Android / Windows ke liye (VP9 WEBM) -->
       
        </video>
    </div>
</body>
</html>
